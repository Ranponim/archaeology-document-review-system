name: Apply Graph Presentation
on:
  push:
    branches: [feature/source-provenance-remediation-20260818]
permissions:
  contents: write
jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-graph-ui]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          python scripts/_patch_graph_presentation.py
          cd frontend && npm ci && npm run typecheck && npm test -- --run graphPresentation.test.ts
      - run: |
          rm scripts/_patch_graph_presentation.py .github/workflows/_apply_graph_presentation.yml
          git config user.name "Ranponim"
          git config user.email "67833251+Ranponim@users.noreply.github.com"
          git add -A
          git commit -m "feat(frontend): present graph in archaeological language"
          git push origin HEAD:feature/source-provenance-remediation-20260818
