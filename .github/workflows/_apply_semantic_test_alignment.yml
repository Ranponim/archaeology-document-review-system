name: Apply Semantic Test Alignment
on:
  push:
    branches: [feature/source-provenance-remediation-20260818]
permissions:
  contents: write
jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-semantic-tests]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply guarded test patch
        run: python scripts/_patch_evidence_graph_semantic_tests.py
      - name: Verify provenance target green
        working-directory: backend
        run: |
          python -m pip install -e . pytest pytest-asyncio
          pytest -q tests/test_source_asset_document_version_target.py tests/test_source_asset_repository.py
      - name: Verify semantic frontend green
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test -- --run src/components/EvidenceGraphExplorer.test.tsx src/components/ProjectStructureExplorer.test.tsx src/graphPresentation.test.ts
      - name: Commit aligned tests
        run: |
          rm scripts/_patch_evidence_graph_semantic_tests.py .github/workflows/_apply_semantic_test_alignment.yml
          git config user.name "Ranponim"
          git config user.email "67833251+Ranponim@users.noreply.github.com"
          git add -A
          git commit -m "test(frontend): align canonical graph semantic labels"
          git push origin HEAD:feature/source-provenance-remediation-20260818
