name: Fix Task 1 Cypher
on:
  push:
    branches: [feature/source-provenance-remediation-20260818]
permissions:
  contents: write
jobs:
  apply:
    if: contains(github.event.head_commit.message, '[task1-cypher]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python scripts/_fix_task1_cypher.py
          python -m py_compile backend/app/graph/project_repository.py
          rm scripts/_fix_task1_cypher.py .github/workflows/_fix_task1_cypher.yml
      - run: |
          git config user.name "Ranponim"
          git config user.email "67833251+Ranponim@users.noreply.github.com"
          git add -A
          git commit -m "fix(projects): preserve cypher clause boundary for timestamp update"
          git push origin HEAD:feature/source-provenance-remediation-20260818
