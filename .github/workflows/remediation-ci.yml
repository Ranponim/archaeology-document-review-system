name: Review remediation CI

on:
  push:
    branches:
      - review-remediation-20260817
      - windows-docker-foundation
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-asyncio
      - name: Compile backend
        run: python -m compileall -q app
      - name: Targeted remediation tests
        run: >-
          pytest -q
          tests/test_review_budget.py
          tests/test_review_round_execution.py
          tests/test_development_review_control.py
          tests/test_strict_review_repository.py
          tests/test_audited_review_repository.py
          tests/test_production_review_repository.py
          tests/test_strict_visual_bundle.py
          tests/test_strict_rule_engine.py
          tests/test_review_project_repository.py
          tests/test_unbounded_round_inputs.py
          tests/test_round_stage_ordering.py
          tests/test_review_round_api.py
          tests/test_candidate_visual_bundle.py
          tests/test_rule_engine_guards.py
      - name: Full backend suite
        run: pytest -q

  neo4j-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/testpassword
        ports:
          - 7687:7687
          - 7474:7474
    defaults:
      run:
        working-directory: backend
    env:
      RUN_NEO4J_INTEGRATION: '1'
      TEST_NEO4J_URI: bolt://localhost:7687
      TEST_NEO4J_PASSWORD: testpassword
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-asyncio
      - name: Real Neo4j canonical path test
        run: pytest -q tests/test_real_neo4j_remediation.py -s

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --run
      - name: Build
        run: npm run build
