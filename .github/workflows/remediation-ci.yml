name: Review remediation CI

on:
  push:
    branches:
      - review-remediation-20260817
      - windows-docker-foundation
  workflow_dispatch:

jobs:
  backend-hermetic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-asyncio
      - name: Compile backend
        run: python -m compileall -q app
      - name: Hermetic backend suite
        run: >-
          pytest -q tests
          --ignore=tests/integration
          --ignore=tests/test_real_neo4j_remediation.py
          --ignore=tests/test_artifact_visual_comparison.py
          --ignore=tests/test_asset_matcher.py
          --ignore=tests/test_asset_review_pipeline.py
          --ignore=tests/test_page_aligner.py
          --ignore=tests/test_panel_render_flow.py
          --ignore=tests/test_pdf_parser.py
          --ignore=tests/test_pdf_parser_layout.py
          --ignore=tests/test_plate_parser.py
          --ignore=tests/test_review_pipeline_e2e.py
          --ignore=tests/test_rule_engine.py
          --junitxml=backend-hermetic-results.xml
      - name: Upload hermetic pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-hermetic-results
          path: backend/backend-hermetic-results.xml

  neo4j-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/testpassword
        ports:
          - 7687:7687
          - 7474:7474
    defaults:
      run:
        working-directory: backend
    env:
      RUN_NEO4J_INTEGRATION: '1'
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: testpassword
      TEST_NEO4J_URI: bolt://127.0.0.1:7687
      TEST_NEO4J_PASSWORD: testpassword
      REVIEW_MODE: development
      DEVELOPMENT_CANDIDATE_BUDGET: '10'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-asyncio
      - name: Wait for Neo4j
        run: |
          python - <<'PY'
          import time
          from neo4j import GraphDatabase
          last = None
          for _ in range(45):
              try:
                  d = GraphDatabase.driver('bolt://127.0.0.1:7687', auth=('neo4j', 'testpassword'))
                  d.verify_connectivity()
                  d.close()
                  print('Neo4j ready')
                  raise SystemExit(0)
              except Exception as exc:
                  last = exc
                  time.sleep(1)
          raise SystemExit(f'Neo4j unavailable: {last}')
          PY
      - name: Real Neo4j integration and E2E suite
        run: pytest -q tests/integration tests/test_real_neo4j_remediation.py -s --junitxml=neo4j-e2e-results.xml
      - name: Upload Neo4j E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neo4j-e2e-results
          path: backend/neo4j-e2e-results.xml

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --run
      - name: Build
        run: npm run build
