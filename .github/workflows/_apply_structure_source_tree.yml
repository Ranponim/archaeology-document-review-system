name: Apply Source Tree Green
on:
  push:
    branches: [feature/source-provenance-remediation-20260818]
permissions:
  contents: write
jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-source-tree]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply guarded patches
        run: |
          python scripts/_patch_structure_source_repo_a.py
          python scripts/_patch_structure_source_repo_b.py
          python scripts/_patch_structure_source_repo_c.py
          python scripts/_patch_structure_source_service.py
          python scripts/_patch_stale_structure_test.py
      - name: Verify targeted backend green
        working-directory: backend
        run: |
          python -m pip install -e . pytest pytest-asyncio
          python -m compileall -q app scripts
          pytest -q tests/test_project_structure_source_assets.py tests/test_project_structure_service.py tests/test_source_import_service.py tests/test_source_asset_repository.py
      - name: Verify frontend contracts
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test -- --run src/components/ProjectStructureExplorer.test.tsx src/graphPresentation.test.ts
      - name: Commit green implementation
        run: |
          rm scripts/_patch_structure_source_repo_a.py scripts/_patch_structure_source_repo_b.py scripts/_patch_structure_source_repo_c.py scripts/_patch_structure_source_service.py scripts/_patch_stale_structure_test.py .github/workflows/_apply_structure_source_tree.yml
          git config user.name "Ranponim"
          git config user.email "67833251+Ranponim@users.noreply.github.com"
          git add -A
          git commit -m "feat(structure): expose project-owned original source tree"
          git push origin HEAD:feature/source-provenance-remediation-20260818
