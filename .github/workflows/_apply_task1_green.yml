name: Apply Task 1 Green

on:
  push:
    branches:
      - feature/source-provenance-remediation-20260818

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-task1]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded replacements
        run: |
          python scripts/_patch_project_repository.py
          python scripts/_patch_task1_backend_contracts.py
          python scripts/_patch_task1_frontend.py
          python -m compileall -q backend/app
      - name: Remove patch transport
        run: |
          rm scripts/_patch_project_repository.py
          rm scripts/_patch_task1_backend_contracts.py
          rm scripts/_patch_task1_frontend.py
          rm .github/workflows/_apply_task1_green.yml
      - name: Commit Task 1 GREEN
        run: |
          git config user.name "Ranponim"
          git config user.email "67833251+Ranponim@users.noreply.github.com"
          git add -A
          git commit -m "feat(projects): complete timestamp contract and publication boundary"
          git push origin HEAD:feature/source-provenance-remediation-20260818
