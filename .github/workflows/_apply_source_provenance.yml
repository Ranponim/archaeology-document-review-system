name: Apply Source Provenance
on:
  push:
    branches: [feature/source-provenance-remediation-20260818]
permissions:
  contents: write
jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-source-provenance]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python scripts/_patch_source_file_store.py
          python scripts/_patch_manifest_asset.py
          cd backend
          python -m pip install -e . pytest pytest-asyncio
          pytest -q tests/test_source_import_service.py tests/test_source_asset_repository.py
          python -m compileall -q app scripts
      - run: |
          rm scripts/_patch_source_file_store.py scripts/_patch_manifest_asset.py .github/workflows/_apply_source_provenance.yml
          git config user.name "Ranponim"
          git config user.email "67833251+Ranponim@users.noreply.github.com"
          git add -A
          git commit -m "feat(provenance): import strict project-owned original assets"
          git push origin HEAD:feature/source-provenance-remediation-20260818
