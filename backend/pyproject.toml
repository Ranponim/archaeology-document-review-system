[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archaeology-document-review-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27.0,<1.0",
    "neo4j>=5.26,<6.0",
    "networkx>=3.2,<4.0",
    "pillow>=10.0.0,<12.0",
    "pymupdf>=1.23.0",
    "python-multipart>=0.0.20,<1.0",
    "pypdf>=5.0,<7.0",
    "redis>=5.2,<6.0",
    "rq>=2.0,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
pythonpath = ["."]

