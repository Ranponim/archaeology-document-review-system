  # ---------------------------------------------------------------------------
  # Case 7: Unit Normalization Dimension Conflict (275cm vs 2.45m / 2.75m)
  # ---------------------------------------------------------------------------
  - case_id: "GT_CASE_007"
    name: "Unit Normalization Dimension Conflict (275cm vs 2.45m conflict, 275cm vs 2.75m match)"
    category: "numeric_unit_normalization"
    ground_truth_status: "VALID_GROUND_TRUTH"
    description: "Cross-draft dimension consistency validation with metric unit normalization"
    dimension_pairs:
      - id: "dim_pair_conflict"
        value_a: "길이 275cm, 너비 120cm, 깊이 45cm"
        value_b: "길이 2.45m, 너비 120cm, 깊이 45cm"
        normalized_a_base_cm: 275.0
        normalized_b_base_cm: 245.0
        consistent: false
        conflict_detected: true
        expected_rule_category: "numeric_value"
        expected_status: "pending_review"
      - id: "dim_pair_match"
        value_a: "길이 275cm, 너비 120cm, 깊이 45cm"
        value_b: "길이 2.75m, 너비 120cm, 깊이 45cm"
        normalized_a_base_cm: 275.0
        normalized_b_base_cm: 275.0
        consistent: true
        conflict_detected: false
        expected_rule_category: null
        expected_status: null
      - id: "weight_pair_match"
        value_a: "무게 1.5kg"
        value_b: "무게 1500g"
        normalized_a_base_g: 1500.0
        normalized_b_base_g: 1500.0
        consistent: true
        conflict_detected: false
    invariant: "275cm vs 2.45m raises numeric conflict candidate in pending_review; 275cm vs 2.75m produces no conflict"

