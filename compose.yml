services:
  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      DATA_ROOT: ${DATA_ROOT}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - neo4j
      - redis
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - review_data:/data

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      DATA_ROOT: ${DATA_ROOT}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - neo4j
      - redis
    volumes:
      - review_data:/data

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    ports:
      - "${NEO4J_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data

  redis:
    image: redis:7.4-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"

volumes:
  review_data:
  neo4j_data:
